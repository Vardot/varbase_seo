name: 'Varbase SEO Test Roles'
description: 'Creates the Varbase user roles (site_admin, content_admin, editor, seo_admin) that the Varbase SEO default recipe grants SEO permissions to. On a full Varbase site these roles are provided by the Varbase profile; the Varbase SEO automated tests run on the Drupal Standard profile, so this helper recipe creates minimal role entities up front. Applied as a dependency recipe before Varbase SEO installs.'
type: 'Testing'
